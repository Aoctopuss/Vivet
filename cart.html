<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cart</title>
        <link rel="stylesheet" href="/public/style.css" />
    </head>
    <body class="bg-[#0A0A0A]">
        <div id="nav" class="flex justify-center mt-2 px-2">
            <nav class="flex items-center justify-between px-6 py-4 rounded-xl shadow-md shadow-purple-500/20 ring-1 ring-purple-500/20 w-full bg-[#0A0A0A] text-white">
                <a href="index.html" class="text-2xl text-[#E8E8E8] hover:text-[#00D4FF]">VIVET</a>
                <div>
                    <a href="cart.html" class="relative">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-8 hover:text-[#00D4FF]"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
                            />
                        </svg>
                        <span id="cart-number" class="absolute -top-2 -right-2 bg-purple-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden"></span>
                    </a>
                </div>
            </nav>
        </div>

        <div class="mt-[100px] ml-[300px] text-white">
            <h1 class="text-4xl text-[#E8E8E8]">Winkelwagen</h1>
            <div id="cart-container" class="ml-20 mt-10 max-w-3xl">
                <div id="cart-items"></div>
                <hr class="my-4" />
                <div class="flex justify-between py-4">
                    <p class="font-semibold text-lg text-white">Totaal</p>
                    <p class="font-semibold text-lg" id="cart-total"></p>
                </div>
                <div class="flex gap-4">
                    <button class="bg-white text-black flex-1 py-4 font-semibold besteld">
                        Bestellen
                    </button>
                    <button class="border px-6 py-4 font-semibold empty">
                        Winkelwagen legen
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
