<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PlaceHolder</title>
        <link rel="stylesheet" href="/public/style.css" />
    </head>
    <body class="bg-[#ffffff]">

        <div id="nav" class="flex justify-center mt-2 px-2 mb-5">
            <nav
                class="flex items-center justify-between px-6 py-4 rounded-xl shadow-md shadow-purple-500/20 ring-1 ring-purple-500/20 w-full bg-[#0A0A0A] text-white"
            >
                <a class="text-2xl text-[#E8E8E8] hover:text-[#00D4FF] ml-[150px]">Admin panel</a>
                <div>
                    <button type="button" class="text-white bg-[#00D4FF] rounded-lg border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Orders</button>
                    <button type="button" class="text-heading bg-transparent rounded-lg box-border border border-transparent hover:bg-neutral-secondary-medium focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Products</button>
                </div>
            </nav>
        </div>

        <div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">
            <table class="w-full text-sm text-left rtl:text-right text-body">
                <thead class="text-sm text-body bg-neutral-secondary-soft border-b rounded-base border-default">
            <tr>
                <th scope="col" class="px-6 py-3 font-medium">
                    ID
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                    Totaal
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                    Datum en Tijd
                </th>
            </tr>
        </thead>
        <tbody id="displayOrder">

        </tbody>
            </table>
        </div>

    </body>

    <script type="module" src="/src/main.js"></script>
</html>
